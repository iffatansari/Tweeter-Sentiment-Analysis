<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentimentLens Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo"></div>
        <div>
          <h2>SentimentLens</h2>
          <p>Local ML Engine Settings</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">Checking...</div>
    </header>

    <main class="popup-body">
      <!-- API URL Configuration -->
      <div class="form-group">
        <label for="apiUrlInput">API Backend URL</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="apiUrlInput"
            placeholder="http://localhost:8000 or https://...trycloudflare.com"
            spellcheck="false"
          >
        </div>
        <p class="form-hint">
          Paste your Cloudflare Tunnel or ngrok HTTPS URL here during development sessions.
        </p>
      </div>

      <!-- Quick Actions -->
      <div class="button-stack">
        <button id="saveBtn" class="btn btn-primary">Save & Test Connection</button>
        <button id="resetLocalBtn" class="btn btn-secondary">Reset to Localhost:8000</button>
      </div>

      <div id="testResult" class="test-result" style="display: none;"></div>

      <hr class="divider">

      <!-- Additional controls -->
      <div class="extra-actions">
        <button id="openSidePanelBtn" class="btn btn-outline">Open Side Panel</button>
        <button id="clearCacheBtn" class="btn btn-outline">Clear Tweet Cache</button>
      </div>
    </main>

    <footer class="popup-footer">
      <span>University TS Mini-Project</span>
    </footer>
  </div>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
